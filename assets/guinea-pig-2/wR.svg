          </g>
          <!-- Floppy Ears Flanking Turret -->
          <path d="M41 33 C33 31 29 38 33 44 C36 46 40 42 42 37 Z" fill="rgb(197, 197, 197)" stroke="#3a3f47" stroke-width="2.4" stroke-linejoin="round"/>
