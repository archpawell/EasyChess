        <path d="M28 52 C22 61 18 73 14 81 C12 84 18 85 23 81 C28 77 32 65 37 61 L50 59 L63 61 C68 65 72 77 77 81 C82 85 88 84 86 81 C82 73 78 61 72 52 C64 57 57 59 50 59 C43 59 36 57 28 52 Z"
              fill="#ffffff" stroke="#3a3f47" stroke-width="2.3" stroke-linejoin="round"/>
        <!-- Plump Body & Head Inside Cape -->
        <path d="M27 69 C25 55 28 40 35 33 C43 28 57 28 65 33 C72 40 75 55 73 69 C70 79 62 82 50 82 C38 82 30 79 27 69 Z"
