        <path d="M28 52 C34 58 42 60 50 60 C58 60 66 58 72 52 C69 60 60 64 50 64 C40 64 31 60 28 52 Z"
              fill="rgb(225, 225, 225)" stroke="#3a3f47" stroke-width="2.2" stroke-linejoin="round"/>
        <ellipse cx="50" cy="60.5" rx="3.5" ry="2.6" fill="#ffffff" stroke="#3a3f47" stroke-width="2"/>
        <!-- High Royal King Crown with 3 Diamond Finials & Jeweled Band -->
        <path d="M36 30 L33 16 L43 23 L50 13 L57 23 L67 16 L64 30 C55 28 45 28 36 30 Z"
              fill="rgb(225, 225, 225)" stroke="#3a3f47" stroke-width="2.4" stroke-linejoin="round"/>
