        <path d="M36 26 C45 24 55 24 64 26" fill="none" stroke="#3a3f47" stroke-width="1.8"/>
        <!-- Diamond Finials on Crown Tips -->
        <polygon points="50,8 52.5,11 50,14 47.5,11" fill="#ffffff" stroke="#3a3f47" stroke-width="1.7"/>
        <polygon points="33,11.5 35,14 33,16.5 31,14" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/>
        <polygon points="67,11.5 69,14 67,16.5 65,14" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/>
        <!-- Floppy Ears -->
        <path d="M34 33 C27 32 24 39 28 44 C31 45 34 41 35 36 Z" fill="rgb(197, 197, 197)" stroke="#3a3f47" stroke-width="2.3"/>
        <path d="M66 33 C73 32 76 39 72 44 C69 45 66 41 65 36 Z" fill="rgb(197, 197, 197)" stroke="#3a3f47" stroke-width="2.3"/>
        <!-- Eyes -->
        <ellipse cx="40" cy="42" rx="2.5" ry="3.3" fill="#2b2f36"/>
        <circle cx="39.2" cy="40.8" r="0.9" fill="#ffffff"/>
        <ellipse cx="60" cy="42" rx="2.5" ry="3.3" fill="#2b2f36"/>
        <circle cx="59.2" cy="40.8" r="0.9" fill="#ffffff"/>
        <!-- Nose & Y-Mouth -->
        <path d="M47.5 48 C49 46.8 51 46.8 52.5 48 C51.5 50.5 48.5 50.5 47.5 48 Z" fill="rgb(197, 197, 197)" stroke="#3a3f47" stroke-width="1.5"/>
        <path d="M50 50 L50 54.5 M46 55.5 Q48.5 57 50 54.5 Q51.5 57 54 55.5" fill="none" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
        <!-- Whiskers -->
        <path d="M41 49 L32 48 M41 52 L33 53 M59 49 L68 48 M59 52 L67 53" stroke="#3a3f47" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
        <!-- Front Standing Paws -->
        <path d="M38 76 L37 84 L40 83 L42 84 L44 83 L44 77" fill="#ffffff" stroke="#3a3f47" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M62 76 L63 84 L60 83 L58 84 L56 83 L56 77" fill="#ffffff" stroke="#3a3f47" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>