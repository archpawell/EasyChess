        <path d="M34 33 C42 31 46 37 45 45 C44 51 35 51 30 45 C28 40 30 35 34 33 Z" fill="rgb(225, 225, 225)"/>
        <path d="M66 33 C58 31 54 37 55 45 C56 51 65 51 70 45 C72 40 70 35 66 33 Z" fill="rgb(225, 225, 225)"/>
